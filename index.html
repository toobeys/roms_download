
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a16">
<title>ROMS NES - Favorite | TOOBEY</title>

<style>
:root {
  --bg:#080a16;
  --panel:#151a32;
  --cyan:#45eaff;
  --purple:#a77bff;
  --pink:#ff65c7;
  --text:#f5f6ff;
  --muted:#9da7c9;
  --line:rgba(139,153,255,.22);
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Arial,sans-serif;
  background:
    radial-gradient(ellipse at 12% 4%,rgba(105,70,220,.25),transparent 34%),
    radial-gradient(ellipse at 92% 15%,rgba(0,200,225,.16),transparent 30%),
    var(--bg);
}

body:before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.13;
  background-image:
    linear-gradient(rgba(130,150,255,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(130,150,255,.16) 1px,transparent 1px);
  background-size:42px 42px;
}

.container {
  width:min(1180px,calc(100% - 30px));
  margin:auto;
  position:relative;
}

header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:25px 0;
}

.brand {
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:3px;
}

.logo {
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#080a16;
  font-size:23px;
  box-shadow:0 0 25px #42e8ff55;
}

.brand small {
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:3px;
  margin-top:4px;
}

.tag {
  font-size:10px;
  color:var(--cyan);
  border:1px solid #45eaff44;
  padding:9px 12px;
  border-radius:30px;
}

.hero {
  text-align:center;
  padding:60px 0 30px;
}

.eyebrow {
  display:inline-block;
  border:1px solid #45eaff55;
  color:var(--cyan);
  padding:9px 15px;
  border-radius:30px;
  font-size:10px;
  letter-spacing:3px;
}

h1 {
  font-size:clamp(36px,7vw,70px);
  margin:20px 0 13px;
  letter-spacing:-3px;
}

h1 span {
  background:linear-gradient(90deg,var(--cyan),#c3a0ff,var(--pink));
  background-clip:text;
  color:transparent;
}

.intro {
  max-width:570px;
  margin:auto;
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
}

.toolbar {
  display:flex;
  align-items:center;
  gap:12px;
  margin:28px 0 20px;
}

.search {
  flex:1;
}

.search input {
  width:100%;
  padding:15px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--panel);
  color:white;
  outline:none;
}

.search input:focus {
  border-color:var(--cyan);
}

.count {
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:17px;
  padding-bottom:55px;
}

.game {
  overflow:hidden;
  border-radius:18px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,#191f3b,#0c0f1f);
  box-shadow:0 12px 34px #0004;
  transition:.25s;
}

.game:hover {
  transform:translateY(-5px);
  border-color:var(--cyan);
  box-shadow:0 0 25px #45eaff22;
}

.cover-wrap {
  height:220px;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#252b50,#10152b);
}

.cover {
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 8px 13px #0008);
  transition:.25s;
}

.game:hover .cover {
  transform:scale(1.04);
}

.fallback {
  display:none;
  text-align:center;
  font-size:40px;
}

.game-body {
  padding:14px 15px 15px;
}

.game h2 {
  font-size:14px;
  line-height:1.4;
  margin:0 0 7px;
  min-height:40px;
}

.region {
  font-size:10px;
  color:var(--muted);
  letter-spacing:1px;
  text-transform:uppercase;
}

.card-bottom {
  display:flex;
  justify-content:space-between;
  border-top:1px solid #ffffff12;
  margin-top:13px;
  padding-top:11px;
}

.card-bottom span {
  font-size:10px;
  color:var(--muted);
}

.card-bottom b {
  font-size:9px;
  color:var(--cyan);
  letter-spacing:1px;
}

.empty {
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:var(--muted);
}

footer {
  border-top:1px solid var(--line);
  padding:25px 0 35px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
}

footer strong {
  color:var(--cyan);
  letter-spacing:3px;
}

@media(max-width:950px) {
  .grid {grid-template-columns:repeat(3,1fr);}
}

@media(max-width:650px) {
  .hero {padding:40px 0 25px;}
  .grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
  .cover-wrap {height:170px;padding:9px;}
  .game-body {padding:11px;}
  .game h2 {font-size:12px;min-height:35px;}
}

@media(max-width:370px) {
  .grid {grid-template-columns:1fr;}
  .cover-wrap {height:220px;}
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="brand">
    <div class="logo">T</div>
    <div>
      TOOBEY
      <small>RETRO GAME COLLECTION</small>
    </div>
  </div>
  <div class="tag">NES · FAVORITE</div>
</header>

<main>

<section class="hero">
  <div class="eyebrow">✦ CLASSIC GAMING ARCHIVE</div>
  <h1>ROMS NES <span>- Favorite</span></h1>
  <p class="intro">
    Koleksi pilihan game klasik NES dalam satu tempat.
    Temukan kembali nuansa arcade retro melalui
    koleksi favorit TOOBEY.
  </p>
</section>

<section class="toolbar">
  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="⌕ Cari judul game..."
    >
  </div>
  <div class="count" id="count">16 GAME</div>
</section>

<section class="grid" id="gameGrid"></section>

</main>

<footer>
  <strong>TOOBEY</strong><br>
  ROMS NES - Favorite<br>
  Retro vibes, timeless games.
</footer>

</div>

<script>
const IMAGE_BASE =
"https://raw.githubusercontent.com/toobeys/roms_download/main/images/";

const games = [
  {
    title:"Super Mario Bros.",
    region:"World",
    image:"Super_Mario_Bros._box-1.png",
    icon:"🍄"
  },
  {
    title:"Super Mario Bros. 25th Anniversary",
    region:"Japan · English",
    image:"Super_Mario_Bros._-_25th_Anniversary.jpg",
    icon:"⭐"
  },
  {
    title:"Super Mario Bros. 2",
    region:"Europe",
    image:"Super_Mario_Bros_2-1.jpg",
    icon:"🍃"
  },
  {
    title:"Super Mario Bros. 3",
    region:"Europe",
    image:"Super_Mario_Bros._3_coverart-1.png",
    icon:"🪄"
  },
  {
    title:"Super Contra",
    region:"Japan",
    image:"Super_contra.jpg",
    icon:"⚡"
  },
  {
    title:"Donkey Kong",
    region:"World · Rev 1",
    image:"Donkey_Kong_flier.jpg",
    icon:"🦍"
  },
  {
    title:"Battle City",
    region:"Translation",
    image:"Battle-City.jpg",
    icon:"🚙"
  },
  {
    title:"Teenage Mutant Ninja Turtles",
    region:"USA",
    image:"Teenage_Mutant_Ninja_Turtles_1989_video_game-1.jpg",
    icon:"🐢"
  },
  {
    title:"Excitebike",
    region:"Europe",
    image:"Excitebike_cover-1.jpg",
    icon:"🏁"
  },
  {
    title:"Bomberman",
    region:"USA",
    image:"BombermanCover.jpg",
    icon:"💣"
  },
  {
    title:"Ice Climber",
    region:"Japan · English",
    image:"IceClimberboxartnes.jpg",
    icon:"❄️"
  },
  {
    title:"Tiny Toon Adventures",
    region:"Europe",
    image:"Tiny_Toon_Adventures_NES_cover.jpg",
    icon:"🐰"
  },
  {
    title:"Circus Charlie",
    region:"Japan",
    image:"Circus-Charlie.jpg",
    icon:"🎪"
  },
  {
    title:"Aladdin",
    region:"Europe",
    image:"Aladdin-1.jpg",
    icon:"🧞"
  },
  {
    title:"Balloon Fight",
    region:"Europe",
    image:"BalloonFightnesboxart.jpg",
    icon:"🎈"
  },
  {
    title:"Adventure Island",
    region:"USA",
    image:"Adventureisland.jpg",
    icon:"🌴"
  }
];

const grid = document.getElementById("gameGrid");
const search = document.getElementById("search");
const count = document.getElementById("count");

function createCard(game,index) {
  const card = document.createElement("article");
  card.className = "game";

  const coverWrap = document.createElement("div");
  coverWrap.className = "cover-wrap";

  const fallback = document.createElement("div");
  fallback.className = "fallback";
  fallback.textContent = game.icon;

  if(game.image) {
    const img = document.createElement("img");
    img.className = "cover";
    img.src = IMAGE_BASE + encodeURIComponent(game.image);
    img.alt = "Cover " + game.title;
    img.loading = "lazy";

    img.onerror = () => {
      img.style.display = "none";
      fallback.style.display = "block";
    };

    coverWrap.appendChild(img);
  } else {
    fallback.style.display = "block";
  }

  coverWrap.appendChild(fallback);

  const body = document.createElement("div");
  body.className = "game-body";

  const title = document.createElement("h2");
  title.textContent = game.title;

  const region = document.createElement("div");
  region.className = "region";
  region.textContent = game.region;

  const bottom = document.createElement("div");
  bottom.className = "card-bottom";

  const number = document.createElement("span");
  number.textContent = "NES / " +
    String(index+1).padStart(2,"0");

  const favorite = document.createElement("b");
  favorite.textContent = "FAVORITE";

  bottom.append(number,favorite);
  body.append(title,region,bottom);
  card.append(coverWrap,body);

  return card;
}

function render(list) {
  count.textContent =
    list.length + " / " + games.length + " GAME";

  grid.replaceChildren();

  if(!list.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Game tidak ditemukan.";
    grid.appendChild(empty);
    return;
  }

  list.forEach(game => {
    grid.appendChild(
      createCard(game,games.indexOf(game))
    );
  });
}

search.addEventListener("input",() => {
  const term = search.value.trim().toLowerCase();

  render(
    games.filter(game =>
      (game.title + " " + game.region)
      .toLowerCase()
      .includes(term)
    )
  );
});

render(games);
</script>

</body>
</html>
